name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: validate

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libfuse2 \
            libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev \
            libxdo-dev patchelf pkg-config rpm wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Check tag and version fields
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-version.mjs --tag "$GITHUB_REF_NAME"

      - name: Check version fields
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: node scripts/check-version.mjs

      - name: Quality gate
        run: make check

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            artifact: bundle-macos-arm64
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: bundle-macos-x64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bundle-windows-x64
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: bundle-linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: ${{ matrix.name }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libfuse2 \
            libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev \
            libxdo-dev patchelf pkg-config rpm wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch the clip burn-in fonts
        run: node scripts/fetch-fonts.mjs

      # tauri-build refuses to run while frontendDist is missing, and the CLI
      # is built before any bundler invocation would create dist/.
      - name: Build the frontend
        run: npm run build

      - name: Build the moka CLI
        shell: bash
        run: node scripts/build-cli.mjs --target "${{ matrix.target }}"

      - name: Build macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.updater.conf.json --target "${{ matrix.target }}" --bundles dmg

      - name: Build combined macOS PKG
        if: runner.os == 'macOS'
        shell: bash
        run: sh scripts/package-macos-pkg.sh --target "${{ matrix.target }}"

      - name: Build Windows MSI
        if: runner.os == 'Windows'
        shell: bash
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json --target "${{ matrix.target }}" --bundles msi

      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.updater.conf.json --target "${{ matrix.target }}" --bundles nsis

      - name: Build Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for bundle in deb rpm; do
            npm run tauri build -- --config src-tauri/tauri.release.conf.json --target "${{ matrix.target }}" --bundles "$bundle"
          done

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.updater.conf.json --target "${{ matrix.target }}" --bundles appimage

      - name: Collect release assets
        run: node scripts/collect-release.mjs

      - name: Package the standalone CLI
        run: node scripts/package-cli.mjs --target "${{ matrix.target }}"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: release/*

  web:
    name: Build web package
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: web-linux-x64

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev \
            libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev \
            libxdo-dev patchelf pkg-config wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch the clip burn-in fonts
        run: node scripts/fetch-fonts.mjs

      - name: Build web package
        run: make package-web

      - name: Archive web package
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tar -czf "release/moka-canvas-web-${version}-linux-x64.tgz" \
            -C release "moka-canvas-web-${version}-linux-x64"

      - name: Upload web package
        uses: actions/upload-artifact@v4
        with:
          name: bundle-web-linux-x64
          if-no-files-found: error
          retention-days: 7
          path: release/*.tgz

  publish:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - web
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Extract release notes
        run: |
          node scripts/release-notes.mjs \
            --version "${GITHUB_REF_NAME#v}" \
            --out release-notes.md

      - name: Normalize assets and write checksums
        run: |
          node scripts/prepare-release.mjs \
            --source artifacts \
            --dest dist \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "${GITHUB_REF_NAME}" \
            --repo moka-works/moka-canvas \
            --notes-file release-notes.md \
            --require-all

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            is_draft=$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release ${GITHUB_REF_NAME} is already published; publish a new patch version instead of mutating a live release."
              exit 1
            fi
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "Moka Canvas ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/moka-canvas-* dist/moka-cli-* dist/latest.json dist/SHA256SUMS.txt --clobber
