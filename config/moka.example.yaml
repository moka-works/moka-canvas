# An example, not a default: copy to config/moka.yaml, which is what the server
# reads when nothing is named with --config, and which no deployment commits.
# Every value written here is the value a server uses with no file at all, so
# deleting a line is the same answer as keeping it.
version: 1
server:
  bind: "127.0.0.1:3000"
  staticDir: "./dist"
  maxUploadBytes: 2147483648
projects:
  maxMokaFileBytes: 33554432
metadata:
  store: "file"
  # Omitted on purpose: the platform application-data directory is resolved at
  # startup. A relative path here would land inside the program tree, which is
  # rejected. Override per deployment with MOKA_METADATA_DIR.
  maxDocumentBytes: 33554432
workflow:
  # Which step executors a run may use. "deterministic" answers the operations
  # that need nothing but the document; "provider" answers a generation node by
  # calling a model; "extension" runs a node whose definition lives under nodes/.
  # Leaving out "provider" does not degrade generation, it refuses it: every
  # such node fails validation as EXECUTOR_DISABLED. The same is true of
  # "extension", which also calls models.
  enabledExecutors: ["deterministic", "provider", "extension"]
generate:
  # How long one provider request may take, per capability. Video is a job:
  # the first budget covers creating it, the second covers a single poll.
  # Words are asked for as a stream, so for text this is how long the channel
  # may stay silent — a thinking model may deliberate before its first word,
  # and a long answer arrives bit by bit, so neither is cut off by a budget
  # that was meant for the whole of it.
  textTimeoutSeconds: 120
  imageTimeoutSeconds: 300
  # One key for both sound capabilities: a line read aloud and a score are each
  # one request answered in seconds, and the name is the one this file has
  # always carried.
  audioTimeoutSeconds: 120
  # Speech recognition is usually an upload of the audio being transcribed, so
  # its budget is far above the others.
  asrTimeoutSeconds: 600
  videoTaskTimeoutSeconds: 60
  videoPollTimeoutSeconds: 30
  # Attempts for a failure that waiting can fix, counting the first. The wait
  # doubles from retryBaseMs, and a Retry-After from the provider wins.
  maxAttempts: 3
  retryBaseMs: 1000
  # Ceilings for reference media sent along with a request.
  maxImageInputBytes: 20971520
  maxMediaInputBytes: 209715200
  # A generation answer can carry a base64 image, so this sits far above the
  # ceiling a model list gets, and above maxOutputBytes: an answer arrives
  # encoded, so the reply carrying it is the larger of the two.
  maxResponseBytes: 402653184
  # How many runs drive at once. One past this waits, and its record says queued
  # until a place is free.
  maxConcurrentRuns: 2
  # Switched on, nothing reaches a provider: the executor that would is not
  # offered at all, so a generation node is refused before its run starts rather
  # than failing part way through one.
  offline: false
  # What one answer may carry. The piece ceiling is the number of cards a node
  # can point at, so an answer that fits is one the canvas can show.
  maxOutputBytes: 268435456
  maxOutputItems: 16
  # Looks at a job a provider is still running before the step waiting on it
  # gives up: five minutes at the interval the executor polls at.
  videoMaxPolls: 120
  # Writes down every call that reaches a provider — the address, the headers,
  # the prompt and the whole answer — as files, for diagnosing an answer that
  # arrived and was the wrong thing. Off unless switched on, and not a setting to
  # leave on: what lands on the disk is the prompt somebody typed. Turned on
  # three ways, in descending order of precedence: the --llm-debug flag, the
  # environment (MOKA_LLM_DEBUG=1), or here. Recordings always go to the
  # "records" subdirectory of the platform application data directory, and a
  # credential is always masked wherever it appears — neither is a setting.
  # See docs/security.md.
  # debug:
  #   enabled: false
story:
  # The story room asks for its answers in batches — a chapter's worth of
  # drawings, an episode filmed shot by shot — and these bound those batches.
  # Timeouts and retries are the ones under generate: a story's generation is a
  # generation like any other.
  # How many stories one project may tell.
  maxStoriesPerProject: 20
  # How many pieces one batch may carry.
  maxItemsPerJob: 40
  # How many generations may be in flight at once, across every batch. A batch
  # of twenty pieces waits its turn here rather than opening twenty calls.
  maxParallelItems: 2
  # How many batches one project may be driving at once. A reader drawing a
  # cast one card at a time makes a batch per card, and those are independent
  # asks; how many generations are really in flight is maxParallelItems.
  maxActiveJobsPerProject: 16
  # How many ended records a project keeps, besides the ones still running.
  keepRecords: 100
clip:
  # Where the timeline exporter finds ffmpeg. Left out, the search goes to
  # MOKA_FFMPEG and then to the platform search path. A machine with no ffmpeg
  # is not a machine that fails to start: export reports itself unavailable and
  # everything else works as before. Never a setting a request can name.
  # ffmpegPath: "/usr/local/bin/ffmpeg"
  # How long one render may run before it is stopped and reported failed.
  timeoutSeconds: 3600
public:
  productName: "Moka Canvas"
  maxUploadBytes: 2147483648
  allowedMediaTypes: ["image", "audio", "video", "text"]
limits:
  maxNodesPerCanvas: 5000
  maxEdgesPerCanvas: 10000
  maxCanvasesPerProject: 64
