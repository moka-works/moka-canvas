[package]
name = "moka-canvas"
version = "0.4.0"
default-run = "moka-canvas"
description = "Local-first visual video workflow editor"
authors = ["Moka Canvas"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "moka_canvas"
crate-type = ["rlib"]

# Only the desktop shell needs Tauri. The web server, the CLI and the test
# targets are built with --no-default-features, which keeps the whole WebView
# stack out of their dependency graph and out of every test binary.
[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-updater",
    "dep:tauri-build",
]

[[bin]]
name = "moka-canvas"
required-features = ["desktop"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bson = { version = "3", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
fs2 = "0.4"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
infer = "0.19"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
minijinja = "2.24.0"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Full DWARF made debug binaries hundreds of megabytes and dominated linking
# on older machines. Line tables keep useful backtraces without that cost.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = "line-tables-only"
