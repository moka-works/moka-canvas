[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.4.1"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[package]
name = "moka-canvas"
version.workspace = true
default-run = "moka-canvas"
description = "Local-first visual video workflow editor"
authors = ["Moka Canvas"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "moka_canvas"
crate-type = ["rlib"]

# Only the desktop shell needs Tauri. The web server, the CLI and the test
# targets are built with --no-default-features, which keeps the whole WebView
# stack out of their dependency graph and out of every test binary.
[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-updater",
    "dep:tauri-build",
]

[[bin]]
name = "moka-canvas"
required-features = ["desktop"]

# Each suite is one linked binary. Keeping the files in a directory of their
# own and naming the root here keeps Cargo from treating every file as a
# separate test target.
[[test]]
name = "suite_core"
path = "tests/suite_core/main.rs"

[[test]]
name = "suite_generate"
path = "tests/suite_generate/main.rs"

[[test]]
name = "suite_providers"
path = "tests/suite_providers/main.rs"

# The recorder is process-wide and starts once, so each test that opens one of
# its own has to be the only test in its binary.
[[test]]
name = "suite_debug_failures"
path = "tests/suite_debug_failures/main.rs"

[[test]]
name = "suite_debug_recording"
path = "tests/suite_debug_recording/main.rs"

# These two place converters of their own in the process-wide models root, so
# each has to win that root alone.
[[test]]
name = "suite_lua_host"
path = "tests/suite_lua_host/main.rs"

[[test]]
name = "suite_converter"
path = "tests/suite_converter/main.rs"

[[test]]
name = "suite_story"
path = "tests/suite_story/main.rs"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
anyhow = "1"
moka-config = { path = "crates/moka-config" }
moka-domain = { path = "crates/moka-domain" }
moka-metadata = { path = "crates/moka-metadata" }
moka-prompts = { path = "crates/moka-prompts" }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bson = { version = "3", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
infer = "0.19"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Full DWARF made debug binaries hundreds of megabytes and dominated linking
# on older machines. Line tables keep useful backtraces without that cost.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = "line-tables-only"
