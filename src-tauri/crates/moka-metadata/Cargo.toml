[package]
name = "moka-metadata"
version = "0.4.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
base64 = "0.22"
fs2 = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
moka-config = { path = "../moka-config" }
moka-domain = { path = "../moka-domain" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
