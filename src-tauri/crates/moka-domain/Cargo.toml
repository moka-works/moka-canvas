[package]
name = "moka-domain"
version = "0.4.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
anyhow = "1"
bson = { version = "3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v7", "serde"] }
